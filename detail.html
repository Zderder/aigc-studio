<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作品详情 - AIGC Studio</title>
<link rel="preconnect" href="https://firebaseio.com">
<link rel="dns-prefetch" href="https://firebaseio.com">
<style>
  :root {
    --accent: #7c3aed;
    --accent2: #06b6d4;
    --accent3: #f59e0b;
    --accent4: #ec4899;
    --bg-dark: #040812;
    --bg-card: rgba(15,18,35,0.85);
    --bg-card-solid: #0f1223;
    --text-primary: #f0f4ff;
    --text-secondary: #94a3b8;
    --border-glow: rgba(124,58,237,0.4);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:#040812;
    color:var(--text-primary);
    font-family:'Segoe UI',system-ui,sans-serif;
    overflow-x:hidden;
    min-height:100vh;
  }

  /* ===== BACKGROUND ===== */
  #neural-canvas{
    position:fixed;top:0;left:0;width:100%;height:100%;
    z-index:0;pointer-events:none;
  }
  .bg-overlay{
    position:fixed;top:0;left:0;width:100%;height:100%;
    background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(124,58,237,0.18) 0%,transparent 70%),
               radial-gradient(ellipse 60% 40% at 80% 80%,rgba(6,182,212,0.12) 0%,transparent 60%);
    z-index:0;pointer-events:none;
  }
  .grid-lines{
    position:fixed;top:0;left:0;width:100%;height:100%;
    background-image:
      linear-gradient(rgba(124,58,237,0.06) 1px,transparent 1px),
      linear-gradient(90deg,rgba(124,58,237,0.06) 1px,transparent 1px);
    background-size:60px 60px;
    animation:gridScroll 20s linear infinite;
    z-index:0;pointer-events:none;
  }
  @keyframes gridScroll{
    0%{background-position:0 0;}
    100%{background-position:60px 60px;}
  }

  /* ===== NAV ===== */
  nav{
    position:fixed;top:0;left:0;right:0;z-index:100;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 5%;
    height:64px;
    background:rgba(4,8,18,0.88);
    backdrop-filter:blur(20px);
    border-bottom:1px solid rgba(124,58,237,0.2);
  }
  .nav-logo{
    display:flex;align-items:center;gap:10px;
    font-size:1.2rem;font-weight:700;letter-spacing:0.04em;
    background:linear-gradient(135deg,#7c3aed,#06b6d4);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    cursor:pointer;
    text-decoration:none;
  }
  .nav-logo svg{width:32px;height:32px;flex-shrink:0;}
  .nav-right{display:flex;align-items:center;gap:12px;}
  .back-btn{
    display:inline-flex;align-items:center;gap:6px;
    padding:7px 16px;border-radius:8px;
    border:1px solid rgba(124,58,237,0.3);
    background:rgba(124,58,237,0.06);
    color:var(--accent);
    font-size:0.85rem;cursor:pointer;
    transition:all .2s;text-decoration:none;
  }
  .back-btn:hover{background:rgba(124,58,237,0.14);border-color:var(--accent);}

  /* ===== MAIN LAYOUT ===== */
  .detail-wrapper{
    position:relative;z-index:1;
    padding:88px 5% 60px;
    max-width:1200px;margin:0 auto;
  }

  /* ===== BREADCRUMB ===== */
  .breadcrumb{
    display:flex;align-items:center;gap:8px;
    font-size:0.82rem;color:var(--text-secondary);
    margin-bottom:28px;
  }
  .breadcrumb a{color:var(--text-secondary);text-decoration:none;transition:color .2s;}
  .breadcrumb a:hover{color:var(--text-primary);}
  .breadcrumb .sep{opacity:0.4;}
  .breadcrumb .current{color:var(--text-primary);font-weight:500;}

  /* ===== DETAIL GRID ===== */
  .detail-grid{
    display:grid;
    grid-template-columns:1fr 380px;
    gap:32px;
    align-items:start;
  }

  /* ===== MAIN IMAGE AREA ===== */
  .detail-media{
    background:var(--bg-card);
    border:1px solid rgba(255,255,255,0.07);
    border-radius:20px;
    overflow:hidden;
    position:relative;
  }
  .media-main{
    width:100%;
    aspect-ratio:4/3;
    background:#080c20;
    position:relative;
    overflow:hidden;
    cursor:grab;
    user-select:none;
    -webkit-user-select:none;
    touch-action:pan-y;
  }
  .media-main:active{cursor:grabbing;}
  .media-main img{
    width:100%;height:100%;
    object-fit:contain;
    display:block;
    transition:transform .3s ease, opacity .25s ease;
    will-change:transform;
  }
  .media-main.swiping img{
    transition:none;
  }
  .media-main video{
    width:100%;height:100%;
    object-fit:contain;
    display:block;
    background:#000;
  }
  .media-nav{
    position:absolute;top:50%;transform:translateY(-50%);
    width:44px;height:44px;border-radius:50%;
    background:rgba(0,0,0,0.55);
    border:1px solid rgba(255,255,255,0.12);
    color:#fff;font-size:1.6rem;cursor:pointer;
    display:none;align-items:center;justify-content:center;
    transition:all .2s, opacity .3s;z-index:5;
    backdrop-filter:blur(8px);
    opacity:0;
  }
  .media-nav:hover{background:rgba(124,58,237,0.6);border-color:rgba(124,58,237,0.5);}
  .media-nav.prev{left:12px;}
  .media-nav.next{right:12px;}
  .media-nav.show{display:flex;}
  .detail-media:hover .media-nav.show{opacity:1;}
  .media-counter{
    position:absolute;bottom:12px;right:12px;
    font-size:0.78rem;color:rgba(255,255,255,0.7);
    background:rgba(0,0,0,0.5);padding:4px 14px;border-radius:100px;
    display:none;z-index:5;backdrop-filter:blur(6px);
  }
  .media-counter.show{display:block;}

  /* ===== SWIPE DOTS INDICATOR ===== */
  .swipe-dots{
    position:absolute;bottom:14px;left:50%;transform:translateX(-50%);
    display:flex;gap:6px;z-index:5;
  }
  .swipe-dot{
    width:7px;height:7px;border-radius:50%;
    background:rgba(255,255,255,0.35);
    transition:all .3s;cursor:pointer;
  }
  .swipe-dot.active{
    background:rgba(124,58,237,0.9);
    box-shadow:0 0 8px rgba(124,58,237,0.5);
    transform:scale(1.3);
  }
  .swipe-dot:hover{background:rgba(255,255,255,0.6);}

  /* ===== THUMBNAIL STRIP ===== */
  .thumb-strip{
    display:flex;gap:8px;padding:12px 16px;
    overflow-x:auto;
    background:rgba(8,10,22,0.5);
    border-top:1px solid rgba(255,255,255,0.05);
  }
  .thumb-strip::-webkit-scrollbar{height:4px;}
  .thumb-strip::-webkit-scrollbar-track{background:transparent;}
  .thumb-strip::-webkit-scrollbar-thumb{background:rgba(124,58,237,0.3);border-radius:2px;}
  .thumb-item{
    width:64px;height:48px;flex-shrink:0;
    border-radius:8px;overflow:hidden;
    border:2px solid transparent;
    cursor:pointer;transition:all .2s;
    opacity:0.5;
  }
  .thumb-item.active{border-color:var(--accent);opacity:1;}
  .thumb-item:hover{opacity:0.85;border-color:rgba(124,58,237,0.4);}
  .thumb-item img{width:100%;height:100%;object-fit:cover;display:block;}

  /* ===== INFO PANEL ===== */
  .detail-info{
    background:var(--bg-card);
    border:1px solid rgba(255,255,255,0.07);
    border-radius:20px;
    padding:28px 24px;
    position:sticky;top:88px;
  }
  .info-type-badge{
    display:inline-block;
    font-size:0.72rem;padding:4px 12px;border-radius:100px;
    letter-spacing:0.08em;text-transform:uppercase;
    margin-bottom:16px;
  }
  .badge-painting{background:rgba(124,58,237,0.15);color:#a78bfa;border:1px solid rgba(124,58,237,0.25);}
  .badge-poster{background:rgba(245,158,11,0.12);color:#fcd34d;border:1px solid rgba(245,158,11,0.25);}
  .badge-video{background:rgba(236,72,153,0.12);color:#f9a8d4;border:1px solid rgba(236,72,153,0.25);}
  .badge-char{background:rgba(6,182,212,0.12);color:#67e8f9;border:1px solid rgba(6,182,212,0.25);}
  .info-title{
    font-size:1.6rem;font-weight:800;
    line-height:1.3;margin-bottom:12px;
    letter-spacing:-0.01em;
  }
  .info-char-display{
    font-size:5rem;line-height:1.1;
    background:linear-gradient(135deg,#06b6d4,#7c3aed);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    margin-bottom:16px;font-weight:900;
    font-family:'Courier New',monospace;
    text-align:center;
  }
  .info-meta{
    display:flex;flex-direction:column;gap:10px;
    margin-bottom:20px;
  }
  .meta-row{
    display:flex;align-items:center;gap:10px;
    font-size:0.85rem;
  }
  .meta-label{
    color:var(--text-secondary);
    min-width:64px;flex-shrink:0;
  }
  .meta-value{
    color:var(--text-primary);
    font-weight:500;
  }
  .info-divider{
    height:1px;
    background:linear-gradient(90deg,transparent,rgba(124,58,237,0.2),transparent);
    margin:20px 0;
  }
  .info-desc-label{
    font-size:0.78rem;color:var(--text-secondary);
    letter-spacing:0.06em;margin-bottom:10px;
    text-transform:uppercase;
  }
  .info-desc{
    font-size:0.92rem;line-height:1.8;
    color:rgba(240,244,255,0.85);
    white-space:pre-wrap;
    word-break:break-word;
  }
  .info-desc.empty{
    color:var(--text-secondary);
    font-style:italic;
  }
  .info-actions{
    display:flex;gap:10px;margin-top:24px;
    flex-wrap:wrap;
  }
  .btn-like{
    display:inline-flex;align-items:center;gap:6px;
    padding:10px 22px;border-radius:10px;
    background:rgba(124,58,237,0.1);
    border:1px solid rgba(124,58,237,0.25);
    color:#a78bfa;font-size:0.88rem;
    cursor:pointer;transition:all .2s;
  }
  .btn-like:hover{background:rgba(124,58,237,0.2);border-color:rgba(124,58,237,0.4);}
  .btn-like.liked{background:rgba(245,158,11,0.12);border-color:rgba(245,158,11,0.3);color:#fcd34d;}

  /* ===== VIDEO EMBED ===== */
  .video-embed-main{
    aspect-ratio:16/9 !important;
    background:#000;
  }
  .video-embed-container{
    position:relative;
    width:100%;
    height:100%;
  }
  .video-embed-container iframe{
    position:absolute;
    top:0;left:0;
    width:100%;
    height:100%;
    border:none;
    border-radius:0 0 20px 20px;
  }

  /* ===== FULLSCREEN LIGHTBOX ===== */
  .fullscreen-overlay{
    display:none;position:fixed;inset:0;z-index:300;
    background:rgba(0,0,0,0.96);
    align-items:center;justify-content:center;
    cursor:zoom-out;
    padding:40px;
  }
  .fullscreen-overlay.show{display:flex;}
  .fullscreen-overlay img{
    max-width:100%;max-height:100%;
    object-fit:contain;
  }
  .fullscreen-close{
    position:fixed;top:20px;right:20px;z-index:310;
    width:40px;height:40px;border-radius:50%;
    background:rgba(0,0,0,0.6);
    border:1px solid rgba(255,255,255,0.15);
    color:#fff;font-size:1.3rem;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .2s;
  }
  .fullscreen-close:hover{background:rgba(124,58,237,0.5);}

  /* ===== NOT FOUND ===== */
  .not-found{
    text-align:center;padding:160px 20px;
    color:var(--text-secondary);
  }
  .not-found .nf-icon{font-size:4rem;margin-bottom:20px;opacity:0.5;}
  .not-found h2{font-size:1.5rem;color:var(--text-primary);margin-bottom:12px;font-weight:700;}
  .not-found p{font-size:0.95rem;margin-bottom:28px;line-height:1.6;}
  .not-found .back-btn{
    display:inline-flex;
  }

  /* ===== LOADING BAR ===== */
  .detail-loader{
    position:fixed;top:0;left:0;z-index:200;
    height:3px;background:linear-gradient(90deg,#7c3aed,#06b6d4);
    border-radius:0 2px 2px 0;
    animation:loadSlide 0.6s ease-out forwards;
  }
  @keyframes loadSlide{
    0%{width:0;}
    100%{width:100%;}
  }

  /* ===== SKELETON SCREEN ===== */
  @keyframes shimmer{
    0%{background-position:-600px 0;}
    100%{background-position:600px 0;}
  }
  .skeleton{
    background:linear-gradient(90deg,rgba(255,255,255,0.04) 25%,rgba(255,255,255,0.09) 50%,rgba(255,255,255,0.04) 75%);
    background-size:600px 100%;
    animation:shimmer 1.4s infinite linear;
    border-radius:10px;
  }
  .skeleton-grid{
    display:grid;
    grid-template-columns:1fr 380px;
    gap:32px;
    align-items:start;
    margin-top:28px;
  }
  .skeleton-media{
    border-radius:20px;overflow:hidden;
    border:1px solid rgba(255,255,255,0.07);
  }
  .skeleton-media-main{
    width:100%;aspect-ratio:4/3;
  }
  .skeleton-thumb-row{
    display:flex;gap:8px;padding:12px 16px;
    background:rgba(8,10,22,0.5);
    border-top:1px solid rgba(255,255,255,0.05);
  }
  .skeleton-thumb{width:64px;height:48px;flex-shrink:0;border-radius:8px;}
  .skeleton-info{
    border-radius:20px;
    border:1px solid rgba(255,255,255,0.07);
    padding:28px 24px;display:flex;flex-direction:column;gap:16px;
    background:rgba(15,18,35,0.85);
  }
  .skeleton-badge{width:80px;height:22px;}
  .skeleton-title{width:85%;height:32px;}
  .skeleton-title-sm{width:60%;height:24px;}
  .skeleton-line{width:100%;height:14px;}
  .skeleton-line-sm{width:70%;height:14px;}
  .skeleton-line-xs{width:45%;height:14px;}

  /* ===== IMAGE FADE-IN ===== */
  .img-fadein{
    opacity:0;
    transition:opacity .35s ease;
  }
  .img-fadein.loaded{
    opacity:1;
  }

  /* ===== CLOUD SYNC INDICATOR ===== */
  .detail-cloud-indicator{
    position:fixed;bottom:24px;right:24px;z-index:150;
    background:rgba(15,18,35,0.92);
    border:1px solid rgba(124,58,237,0.3);
    border-radius:12px;padding:10px 16px;
    font-size:0.82rem;color:var(--text-secondary);
    display:none;align-items:center;gap:8px;
    backdrop-filter:blur(12px);
    box-shadow:0 4px 24px rgba(0,0,0,0.4);
    transition:opacity .3s;
  }
  .detail-cloud-indicator.show{display:flex;}
  .detail-cloud-indicator .spin{
    width:14px;height:14px;border-radius:50%;
    border:2px solid rgba(124,58,237,0.3);
    border-top-color:#7c3aed;
    animation:spin .8s linear infinite;flex-shrink:0;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ===== SCROLLBAR ===== */
  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-track{background:#040812;}
  ::-webkit-scrollbar-thumb{background:rgba(124,58,237,0.4);border-radius:3px;}

  /* ===== RESPONSIVE ===== */
  @media(max-width:900px){
    .detail-grid{grid-template-columns:1fr;gap:20px;}
    .detail-info{position:static;}
    .skeleton-grid{grid-template-columns:1fr;}
  }
  @media(max-width:640px){
    .detail-wrapper{padding:76px 4% 40px;}
    .info-title{font-size:1.3rem;}
    .media-nav{width:36px;height:36px;font-size:1.3rem;}
    nav{padding:0 4%;}
  }
</style>
</head>

<script>
// ===== CONSTANTS =====
// getData(), getLocalData() and saveData() are provided by db.js

// ===== PARSE URL PARAMS =====
const params=new URLSearchParams(window.location.search);
const itemId=params.get('id');
const itemType=params.get('type');

// ===== NEURAL CANVAS BG =====
(function(){
  const canvas=document.getElementById('neural-canvas');
  const ctx=canvas.getContext('2d');
  let W,H,nodes=[];
  function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
  resize();window.addEventListener('resize',()=>{resize();initNodes();});
  function initNodes(){
    const count=Math.floor(W*H/20000);
    nodes=[];
    for(let i=0;i<count;i++){
      nodes.push({
        x:Math.random()*W,y:Math.random()*H,
        vx:(Math.random()-.5)*0.3,vy:(Math.random()-.5)*0.3,
        r:Math.random()*1.5+0.5,
        color:['#7c3aed','#06b6d4','#f59e0b','#ec4899'][Math.floor(Math.random()*4)]
      });
    }
  }
  initNodes();
  const DIST=100;
  function draw(){
    ctx.clearRect(0,0,W,H);
    for(let i=0;i<nodes.length;i++){
      const n=nodes[i];
      n.x+=n.vx;n.y+=n.vy;
      if(n.x<0||n.x>W)n.vx*=-1;
      if(n.y<0||n.y>H)n.vy*=-1;
      ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
      ctx.fillStyle=n.color+'66';ctx.fill();
      for(let j=i+1;j<nodes.length;j++){
        const m=nodes[j];
        const dx=m.x-n.x,dy=m.y-n.y;
        const d=Math.sqrt(dx*dx+dy*dy);
        if(d<DIST){
          ctx.beginPath();ctx.moveTo(n.x,n.y);ctx.lineTo(m.x,m.y);
          ctx.strokeStyle=`rgba(124,58,237,${0.12*(1-d/DIST)})`;
          ctx.lineWidth=0.4;ctx.stroke();
        }
      }
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

// ===== VIDEO URL PARSER =====
function getVideoEmbedInfo(url){
  if(!url) return null;
  // Direct video file link
  if(/\.(mp4|webm|ogg|mov)(\?|$)/i.test(url)){
    return {type:'direct',src:url};
  }
  // Bilibili: bilibili.com/video/BVxxx or b23.tv short links
  let bvMatch=url.match(/bilibili\.com\/video\/(BV[a-zA-Z0-9]+)/);
  if(bvMatch) return {type:'bilibili',bvid:bvMatch[1]};
  let b23Match=url.match(/b23\.tv\/([a-zA-Z0-9]+)/);
  if(b23Match) return {type:'bilibili_short',code:b23Match[1]};
  // YouTube: youtube.com/watch?v=xxx or youtu.be/xxx
  let ytMatch=url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  if(ytMatch) return {type:'youtube',vid:ytMatch[1]};
  // Unknown URL - return as external
  return {type:'external',src:url};
}

// ===== SKELETON SCREEN =====
function showSkeleton(){
  const container=document.getElementById('detailContent');
  container.innerHTML=`
    <div style="margin-bottom:28px;display:flex;gap:8px;align-items:center;">
      <div class="skeleton" style="width:40px;height:14px;border-radius:4px;"></div>

// ===== RENDER DETAIL =====
let currentImages=[],currentImageIndex=0;

// Build and inject detail HTML from a data object
function buildDetailHtml(data){
  let item=null;
  let typeLabel='',badgeClass='',sectionId='';

  if(itemType==='painting'){
    item=data.paintings.find(i=>i.id===itemId);
    typeLabel='AI 绘画';badgeClass='badge-painting';sectionId='#painting';
  }else if(itemType==='poster'){
    item=data.posters.find(i=>i.id===itemId);
    typeLabel='AI 海报';badgeClass='badge-poster';sectionId='#poster';
  }else if(itemType==='video'){
    item=data.videos.find(i=>i.id===itemId);
    typeLabel='AI 视频';badgeClass='badge-video';sectionId='#video';
  }else if(itemType==='char'){
    item=data.chars.find(i=>i.id===itemId);
    typeLabel='超级字符';badgeClass='badge-char';sectionId='#superchar';
  }

  if(!item) return null;

  // Build images array
  if(itemType==='video'){
    currentImages=[];
    currentImageIndex=0;
  }else{
    currentImages=item.imgs&&item.imgs.length?item.imgs:(item.img?[item.img]:[]);
    currentImageIndex=0;
  }

  // Format date
  const dateStr=item.createdAt?new Date(item.createdAt).toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'}):'未知';

  // Check video embed info for URL-based videos
  let videoEmbed=null;
  if(itemType==='video'&&item.url&&!item.videoData){
    videoEmbed=getVideoEmbedInfo(item.url);
  }

  let html=`<div class="breadcrumb">
    <a href="index.html">首页</a>
    <span class="sep">/</span>
    <a href="index.html${sectionId}">${typeLabel}</a>
    <span class="sep">/</span>
    <span class="current">${item.title||'无标题'}</span>
  </div>`;

  html+=`<div class="detail-grid">`;

  // ===== LEFT: MEDIA =====
  html+=`<div class="detail-media">`;

  if(itemType==='video'){
    if(item.videoData){
      html+=`<div class="media-main" id="mediaMain" onclick="openFullscreen()" style="cursor:default;">
        <video id="mainVideo" src="${item.videoData}" ${item.thumb?`poster="${item.thumb}"`:''}
          controls preload="metadata"
          style="width:100%;height:100%;object-fit:contain;display:block;background:#000;">
        </video>
      </div>`;
    }else if(videoEmbed&&(videoEmbed.type==='direct')){
      html+=`<div class="media-main" id="mediaMain" style="cursor:default;">
        <video id="mainVideo" src="${escHtml(videoEmbed.src)}" ${item.thumb?`poster="${item.thumb}"`:''}
          controls preload="metadata"
          style="width:100%;height:100%;object-fit:contain;display:block;background:#000;">
        </video>
      </div>`;
    }else if(videoEmbed&&(videoEmbed.type==='bilibili')){
      html+=`<div class="media-main video-embed-main" id="mediaMain" style="cursor:default;aspect-ratio:auto;padding-bottom:0;">
        <div class="video-embed-container">
          <iframe
            src="//player.bilibili.com/player.html?bvid=${videoEmbed.bvid}&autoplay=0&high_quality=1"
            scrolling="no" border="0" frameborder="no" framespacing="0" allowfullscreen="true"
            sandbox="allow-top-navigation allow-same-origin allow-forms allow-scripts allow-popups"
          ></iframe>
        </div>
      </div>`;
    }else if(videoEmbed&&(videoEmbed.type==='youtube')){
      html+=`<div class="media-main video-embed-main" id="mediaMain" style="cursor:default;aspect-ratio:auto;padding-bottom:0;">
        <div class="video-embed-container">
          <iframe
            src="https://www.youtube.com/embed/${videoEmbed.vid}?rel=0"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen
          ></iframe>
        </div>
      </div>`;
    }else{
      html+=`<div class="media-main" id="mediaMain" onclick="openExternalVideo('${escHtml(item.url)}')" style="cursor:pointer;">
        ${item.thumb?`<img src="${item.thumb}" alt="${item.title}" decoding="async">`
          :`<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0d1030,#2d0a22);">
            <div style="text-align:center;">
              <div style="font-size:3rem;margin-bottom:8px;">&#9654;</div>
              <div style="font-size:0.85rem;color:var(--text-secondary);">点击播放视频</div>
            </div>
          </div>`}
      </div>`;
    }
  }else{
    // Image type — main image with fade-in
    html+=`<div class="media-main" id="mediaMain" onclick="openFullscreen()">`;
    const cover=currentImages[0]||'';
    if(cover){
      html+=`<img id="mainImage" class="img-fadein" src="${cover}" alt="${item.title}" decoding="async" onload="this.classList.add('loaded')">`;
    }else{
      html+=`<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0d1030,#1a0a3d);font-size:4rem;">${itemType==='char'?item.char||'&#10024;':itemType==='painting'?'&#127912;':itemType==='poster'?'&#128438;':'&#127916;'}</div>`;
    }
    if(currentImages.length>1){
      html+=`<button class="media-nav prev show" id="mediaPrev" onclick="event.stopPropagation();switchImage(-1)">&#8249;</button>`;
      html+=`<button class="media-nav next show" id="mediaNext" onclick="event.stopPropagation();switchImage(1)">&#8250;</button>`;
      html+=`<div class="media-counter show" id="mediaCounter">1 / ${currentImages.length}</div>`;
      html+=`<div class="swipe-dots" id="swipeDots">`;
      currentImages.forEach((_,i)=>{
        html+=`<div class="swipe-dot${i===0?' active':''}" onclick="event.stopPropagation();goToImage(${i})"></div>`;
      });
      html+=`</div>`;
    }
    html+=`</div>`; // end media-main

    // Thumbnail strip — lazy loaded
    if(currentImages.length>1){
      html+=`<div class="thumb-strip" id="thumbStrip">`;
      currentImages.forEach((src,i)=>{
        html+=`<div class="thumb-item${i===0?' active':''}" onclick="goToImage(${i})"><img src="${src}" alt="缩略图 ${i+1}" loading="lazy" decoding="async"></div>`;
      });
      html+=`</div>`;
    }
  }

  // External link indicator
  if(itemType==='video'&&videoEmbed&&videoEmbed.type==='external'){
    html+=`<div style="padding:16px;text-align:center;">
      <a href="${escHtml(item.url)}" target="_blank" rel="noopener" class="back-btn" style="font-size:0.95rem;padding:12px 28px;">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0zM6.271 5.055a.5.5 0 0 0-.518.012L3.13 7.032a.5.5 0 0 0 0 .858l2.623 1.965a.5.5 0 0 0 .772-.416V5.471a.5.5 0 0 0-.254-.416z"/><path d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0zm3.067 5.055a.5.5 0 0 0-.518.012L8.1 6.906V11.34a.5.5 0 0 0 .772-.416l2.623-1.965a.5.5 0 0 0 0-.858l-2.623-1.965a.5.5 0 0 0-.254-.08z" opacity=".6"/></svg>
        &#x5728;&#x65B0;&#x7A97;&#x53E3;&#x64AD;&#x653E;&#x89C6;&#x9891;
      </a>
      <div style="font-size:0.75rem;color:var(--text-secondary);margin-top:8px;">&#x70B9;&#x51FB;&#x4E0A;&#x65B9;&#x5C01;&#x9762;&#x6216;&#x6B64;&#x6309;&#x94AE;&#x8DF3;&#x8F6C;&#x81F3;&#x89C6;&#x9891;&#x6E90;&#x7AD9;</div>
    </div>`;
  }

  html+=`</div>`; // end detail-media

  // ===== RIGHT: INFO PANEL =====
  html+=`<div class="detail-info">`;
  html+=`<div class="info-type-badge ${badgeClass}">${typeLabel}</div>`;

  if(itemType==='video'&&item.url&&!item.videoData){
    const sourceLabels={direct:'直链视频',bilibili:'哔哩哔哩',youtube:'YouTube',bilibili_short:'哔哩哔哩',external:'外部链接'};
    const sourceLabel=sourceLabels[videoEmbed.type]||'外部链接';
    html+=`<div style="display:inline-flex;align-items:center;gap:6px;font-size:0.78rem;color:var(--text-secondary);margin-bottom:12px;padding:4px 10px;border-radius:6px;background:rgba(236,72,153,0.06);border:1px solid rgba(236,72,153,0.12);">
      <span>&#x1F310;</span> ${sourceLabel}
      ${videoEmbed.type==='external'?' (不支持内嵌)':''}
    </div>`;
  }

  if(itemType==='char'&&item.char){
    html+=`<div class="info-char-display">${item.char}</div>`;
  }

  html+=`<h1 class="info-title">${item.title||'无标题'}</h1>`;

  html+=`<div class="info-meta">`;
  if(item.tool){
    html+=`<div class="meta-row">
      <span class="meta-label">&#x1F3A8; 工具</span>
      <span class="meta-value">${escHtml(item.tool)}</span>
    </div>`;
  }
  html+=`<div class="meta-row">
    <span class="meta-label">&#x1F4C5; 日期</span>
    <span class="meta-value">${dateStr}</span>
  </div>`;
  if(currentImages.length>0&&itemType!=='video'){
    html+=`<div class="meta-row">
      <span class="meta-label">&#x1F5BC;&#xFE0F; 图片</span>
      <span class="meta-value">${currentImages.length} 张</span>
    </div>`;
  }
  html+=`</div>`; // end info-meta

  html+=`<div class="info-divider"></div>`;

  html+=`<div class="info-desc-label">&#x1F4DD; 作品简介</div>`;
  if(item.desc){
    html+=`<div class="info-desc">${escHtml(item.desc)}</div>`;
  }else{
    html+=`<div class="info-desc empty">暂无描述</div>`;
  }

  const isLiked=item.likes>0;
  html+=`<div class="info-actions">
    <button class="btn-like${isLiked?' liked':''}" id="likeBtn" onclick="toggleLike()">
      <span id="likeIcon">${isLiked?'&#x2764;&#xFE0F;':'&#x2661;'}</span>
      <span id="likeCount">${item.likes||0}</span>
    </button>
  </div>`;

  html+=`</div>`; // end detail-info
  html+=`</div>`; // end detail-grid

  return { html, item };
}

async function renderDetail(){
  if(!itemId||!itemType){
    renderNotFound('缺少作品参数');return;
  }

  // === Phase 1: Local data — render immediately ===
  const localData=await getLocalData();
  const localResult=buildDetailHtml(localData);

  if(localResult){
    const container=document.getElementById('detailContent');
    container.innerHTML=localResult.html;
    document.title=(localResult.item.title||'无标题')+' - AIGC Studio';
    // Remove loader quickly since content is shown
    const loader=document.getElementById('detailLoader');
    if(loader) loader.style.display='none';
  }else{
    // No local data — show skeleton while waiting for cloud
    showSkeleton();
  }

  // === Phase 2: Cloud sync in background ===
  showDetailCloudLoading(true);
  try{
    const cloudData=await getData(); // timestamp-based merge in db.js
    showDetailCloudLoading(false);

    const cloudTs=cloudData._ts||0;
    const localTs=localData._ts||0;

    // Only re-render if cloud has newer data
    if(cloudTs>localTs||!localResult){
      const cloudResult=buildDetailHtml(cloudData);
      if(cloudResult){
        const container=document.getElementById('detailContent');
        container.innerHTML=cloudResult.html;
        document.title=(cloudResult.item.title||'无标题')+' - AIGC Studio';
        const loader=document.getElementById('detailLoader');
        if(loader) loader.style.display='none';
      }else if(!localResult){
        renderNotFound('未找到该作品');
      }
    }
  }catch(e){
    showDetailCloudLoading(false);
    if(!localResult) renderNotFound('未找到该作品');
  }
}

function escHtml(str){
  const div=document.createElement('div');
  div.textContent=str;
  return div.innerHTML;
}

function renderNotFound(msg){
  document.getElementById('detailContent').innerHTML=`
    <div class="not-found">
      <div class="nf-icon">&#128533;</div>
      <h2>${msg||'作品未找到'}</h2>
      <p>可能该作品已被下架或删除，请返回首页浏览其他作品</p>
      <a href="index.html" class="back-btn">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path fill-rule="evenodd" d="M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0z"/></svg>
        返回首页
      </a>
    </div>`;
}

// ===== IMAGE SWITCHING =====
function switchImage(dir){
  if(currentImages.length<2) return;
  currentImageIndex=(currentImageIndex+dir+currentImages.length)%currentImages.length;
  updateMainImage();
}

function goToImage(index){
  currentImageIndex=index;
  updateMainImage();
}

function updateMainImage(){
  const img=document.getElementById('mainImage');
  if(!img) return;
  img.style.opacity='0';
  setTimeout(()=>{
    img.src=currentImages[currentImageIndex];
    img.style.opacity='1';
  },150);
  // Update counter
  const counter=document.getElementById('mediaCounter');
  if(counter) counter.textContent=(currentImageIndex+1)+' / '+currentImages.length;
  // Update thumbnails
  const thumbs=document.querySelectorAll('.thumb-item');
  thumbs.forEach((t,i)=>{
    t.classList.toggle('active',i===currentImageIndex);
  });
  // Update swipe dots
  const dots=document.querySelectorAll('.swipe-dot');
  dots.forEach((d,i)=>{
    d.classList.toggle('active',i===currentImageIndex);
  });
}

// ===== SWIPE / DRAG IMAGE NAVIGATION =====
(function(){
  var startX=0, startY=0, deltaX=0, dragging=false, isSwipe=false;
  var THRESHOLD=50;
  var mediaMain=null;

  function initSwipe(){
    mediaMain=document.getElementById('mediaMain');
    if(!mediaMain||currentImages.length<2) return;

    // Touch events
    mediaMain.addEventListener('touchstart', onTouchStart, {passive:true});
    mediaMain.addEventListener('touchmove', onTouchMove, {passive:false});
    mediaMain.addEventListener('touchend', onTouchEnd);

    // Mouse events (desktop drag)
    mediaMain.addEventListener('mousedown', onMouseDown);
    window.addEventListener('mousemove', onMouseMove);
    window.addEventListener('mouseup', onMouseUp);
  }

  function onTouchStart(e){
    if(currentImages.length<2) return;
    startX=e.touches[0].clientX;
    startY=e.touches[0].clientY;
    deltaX=0;
    dragging=true;
    isSwipe=false;
  }
  function onTouchMove(e){
    if(!dragging||currentImages.length<2) return;
    var dx=e.touches[0].clientX-startX;
    var dy=e.touches[0].clientY-startY;
    // Only handle horizontal swipes
    if(!isSwipe&&Math.abs(dy)>Math.abs(dx)){
      dragging=false; return;
    }
    isSwipe=true;
    if(isSwipe) e.preventDefault();
    deltaX=dx;
    var img=document.getElementById('mainImage');
    if(img){
      mediaMain.classList.add('swiping');
      img.style.transform='translateX('+deltaX+'px) scale(1.02)';
      img.style.opacity=Math.max(0.3,1-Math.abs(deltaX)/400);
    }
  }
  function onTouchEnd(){
    if(!dragging) return;
    dragging=false;
    finishSwipe();
  }

  function onMouseDown(e){
    if(currentImages.length<2||e.button!==0) return;
    // Don't interfere with fullscreen click
    if(e.target.closest('.media-nav')||e.target.closest('.swipe-dot')) return;
    startX=e.clientX;
    deltaY=0; deltaX=0;
    dragging=true;
    isSwipe=false;
    e.preventDefault();
  }
  function onMouseMove(e){
    if(!dragging||currentImages.length<2) return;
    var dx=e.clientX-startX;
    if(!isSwipe&&Math.abs(dx)>8) isSwipe=true;
    if(!isSwipe) return;
    deltaX=dx;
    var img=document.getElementById('mainImage');
    if(img){
      mediaMain.classList.add('swiping');
      img.style.transform='translateX('+deltaX+'px) scale(1.02)';
      img.style.opacity=Math.max(0.3,1-Math.abs(deltaX)/400);
    }
  }
  function onMouseUp(){
    if(!dragging) return;
    dragging=false;
    finishSwipe();
  }

  function finishSwipe(){
    var img=document.getElementById('mainImage');
    if(img){
      img.style.transform='';
      img.style.opacity='';
      mediaMain.classList.remove('swiping');
    }
    if(isSwipe){
      if(deltaX>THRESHOLD){
        switchImage(-1);
      }else if(deltaX<-THRESHOLD){
        switchImage(1);
      }
    }
    deltaX=0;
    isSwipe=false;
  }

  // Re-init after render
  var origUpdate=window.updateMainImage;
  var _origBuild=window.buildDetailHtml;
  var _afterBuild=function(){
    setTimeout(initSwipe,50);
  };

  // Hook into renderDetail to init swipe after DOM update
  var _origRender=window.renderDetail;
  window.renderDetail=async function(){
    await _origRender.call(this);
    setTimeout(initSwipe,50);
  };

  // Also init on first load
  setTimeout(initSwipe,200);
})();

// ===== FULLSCREEN LIGHTBOX =====
function openFullscreen(){
  if(currentImages.length<1) return;
  const overlay=document.getElementById('fullscreenOverlay');
  document.getElementById('fullscreenImg').src=currentImages[currentImageIndex];
  overlay.classList.add('show');
}

// ===== OPEN EXTERNAL VIDEO =====
function openExternalVideo(url){
  window.open(url,'_blank','noopener');
}

function closeFullscreen(){
  document.getElementById('fullscreenOverlay').classList.remove('show');
}

document.getElementById('fullscreenClose').onclick=closeFullscreen;
document.getElementById('fullscreenOverlay').onclick=function(e){
  if(e.target===this||e.target===document.getElementById('fullscreenImg')) closeFullscreen();
};

// ===== LIKE TOGGLE =====
async function toggleLike(){
  if(!itemId||!itemType) return;
  const data=await getData();
  let arr;
  if(itemType==='painting') arr=data.paintings;
  else if(itemType==='poster') arr=data.posters;
  else if(itemType==='video') arr=data.videos;
  else if(itemType==='char') arr=data.chars;
  const item=arr.find(i=>i.id===itemId);
  if(!item) return;
  item.likes=(item.likes||0)?0:1;
  await saveData(data);
  // Update UI
  const btn=document.getElementById('likeBtn');
  const icon=document.getElementById('likeIcon');
  const count=document.getElementById('likeCount');
  btn.classList.toggle('liked',item.likes>0);
  icon.textContent=item.likes?'&#x2764;&#xFE0F;':'&#x2661;';
  count.textContent=item.likes||0;
}

// ===== KEYBOARD NAV =====
document.addEventListener('keydown',function(e){
  // Fullscreen close
  if(document.getElementById('fullscreenOverlay').classList.contains('show')){
    if(e.key==='Escape') closeFullscreen();
    if(e.key==='ArrowLeft'){e.preventDefault();switchImage(-1);}
    if(e.key==='ArrowRight'){e.preventDefault();switchImage(1);}
    return;
  }
  // Main image navigation
  if(currentImages.length>1){
    if(e.key==='ArrowLeft') switchImage(-1);
    if(e.key==='ArrowRight') switchImage(1);
  }
  if(e.key==='Escape'){
    window.location.href='index.html';
  }
});

// ===== INIT =====
// Show skeleton immediately while local data loads
showSkeleton();
renderDetail();
